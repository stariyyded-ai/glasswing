name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reference assemblies for .NET Framework 4.8
        run: |
          curl -sSL -o refs.nupkg https://api.nuget.org/v3-flatcontainer/microsoft.netframework.referenceassemblies.net48/1.0.3/microsoft.netframework.referenceassemblies.net48.1.0.3.nupkg
          mkdir -p refs && unzip -q refs.nupkg -d refs

      - name: Build Glasswing.exe
        shell: pwsh
        run: |
          $out = & ./build.ps1 -RefDir refs/build/.NETFramework/v4.8
          $out
          if (-not ($out -match '^ok:')) { exit 1 }

      - name: Checksum
        run: |
          cd out
          sha256sum Glasswing.exe | cut -d' ' -f1 > Glasswing.exe.sha256
          cat Glasswing.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Glasswing
          path: |
            out/Glasswing.exe
            out/Glasswing.exe.sha256

      # Релиз выходит сам, когда в main попадает новая версия в src/App.cs
      # и рядом лежат её заметки releases/v<версия>.md. Тег создаёт gh.
      - name: Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(grep -oP 'Version = "\K[^"]+' src/App.cs)
          tag="v$ver"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "App.Version $ver does not match tag $GITHUB_REF_NAME"; exit 1
          fi
          notes="releases/$tag.md"
          if [[ "$GITHUB_REF" != refs/tags/* && ! -f "$notes" ]]; then
            echo "No $notes, not releasing $tag"; exit 0
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"; exit 0
          fi
          [ -f "$notes" ] || notes=/dev/null
          gh release create "$tag" out/Glasswing.exe out/Glasswing.exe.sha256 --target "$GITHUB_SHA" --title "Glasswing $ver" --notes-file "$notes"
